<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camera Tester</title>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#666; --card:#f4f4f5; --accent:#2563eb; --ok:#16a34a; --err:#dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0b0c; --fg:#eee; --muted:#999; --card:#1c1c1f; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom)); background:var(--bg); color:var(--fg);
         font:15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size:20px; margin:0 0 12px; }
  h2 { font-size:16px; margin:0 0 8px; }
  section { background:var(--card); border-radius:10px; padding:12px; margin-bottom:12px; }
  button { display:inline-block; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 14px;
           font-size:15px; margin:4px 4px 4px 0; cursor:pointer; }
  button.secondary { background:#6b7280; }
  video, canvas { width:100%; max-height:50vh; object-fit:contain; background:#000; border-radius:8px; display:block; margin-top:8px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td { padding:3px 4px; vertical-align:top; word-break:break-all; }
  td:first-child { color:var(--muted); white-space:nowrap; word-break:normal; width:1%; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  #log { font:12px/1.4 ui-monospace, Menlo, monospace; white-space:pre-wrap; max-height:240px; overflow:auto; margin:0; }
</style>
</head>
<body>
<h1>Camera Tester</h1>

<section>
  <h2>Environment</h2>
  <table id="env"></table>
</section>

<section>
  <h2>1. getUserMedia (live stream)</h2>
  <button id="startBack">Back camera</button>
  <button id="startFront">Front camera</button>
  <button id="snap" class="secondary">Capture frame</button>
  <button id="stop" class="secondary">Stop</button>
  <video id="video" autoplay playsinline muted hidden></video>
  <canvas id="canvas" hidden></canvas>
</section>

<section>
  <h2>2. Devices &amp; permissions</h2>
  <button id="enumerate" class="secondary">Enumerate devices</button>
  <button id="perm" class="secondary">Query permission</button>
</section>

<section>
  <h2>Log</h2>
  <button id="clear" class="secondary">Clear</button>
  <pre id="log"></pre>
</section>

<script>
const $ = (id) => document.getElementById(id);
const logEl = $('log');
function log(msg, cls) {
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logEl.prepend(line);
  (cls === 'err' ? console.error : console.log)('[camera-tester]', msg);
}
window.addEventListener('error', (e) => log(`window.onerror: ${e.message}`, 'err'));
window.addEventListener('unhandledrejection', (e) => log(`unhandledrejection: ${e.reason}`, 'err'));

// Environment
const env = {
  'URL': location.href,
  'Origin': location.origin,
  'In iframe': String(window.self !== window.top),
  'isSecureContext': String(window.isSecureContext),
  'navigator.mediaDevices': String(!!navigator.mediaDevices),
  'getUserMedia': String(!!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)),
  'permissions API': String(!!navigator.permissions),
  'User agent': navigator.userAgent,
  'Viewport': `${innerWidth}x${innerHeight} @${devicePixelRatio}x`,
};
for (const [k, v] of Object.entries(env)) {
  const tr = document.createElement('tr');
  const cls = v === 'true' ? 'ok' : v === 'false' && k !== 'In iframe' ? 'err' : '';
  tr.innerHTML = `<td>${k}</td><td class="${cls}"></td>`;
  tr.lastChild.textContent = v;
  $('env').appendChild(tr);
}

// getUserMedia
let stream = null;
const video = $('video');
function stopStream() {
  if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
  video.srcObject = null; video.hidden = true;
}
async function start(facingMode) {
  stopStream();
  if (!navigator.mediaDevices?.getUserMedia) {
    log('navigator.mediaDevices.getUserMedia is not available', 'err');
    return;
  }
  log(`getUserMedia({ video: { facingMode: "${facingMode}" } })...`);
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode }, audio: false });
    video.srcObject = stream; video.hidden = false;
    await video.play().catch((e) => log(`video.play(): ${e.name}: ${e.message}`, 'err'));
    const track = stream.getVideoTracks()[0];
    const s = track.getSettings ? track.getSettings() : {};
    log(`OK: "${track.label}" ${s.width}x${s.height} facing=${s.facingMode ?? 'n/a'}`, 'ok');
  } catch (e) {
    log(`getUserMedia failed: ${e.name}: ${e.message}`, 'err');
  }
}
$('startBack').onclick = () => start('environment');
$('startFront').onclick = () => start('user');
$('stop').onclick = () => { stopStream(); log('Stream stopped'); };
$('snap').onclick = () => {
  if (!stream) { log('No active stream to capture', 'err'); return; }
  const c = $('canvas');
  c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext('2d').drawImage(video, 0, 0);
  c.hidden = false;
  log(`Captured frame ${c.width}x${c.height}`, 'ok');
};

// Devices & permissions
$('enumerate').onclick = async () => {
  if (!navigator.mediaDevices?.enumerateDevices) { log('enumerateDevices not available', 'err'); return; }
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter((d) => d.kind === 'videoinput');
    log(`${devices.length} devices, ${cams.length} cameras`);
    cams.forEach((d, i) => log(`  cam ${i}: label="${d.label || '(hidden until permission granted)'}" id=${d.deviceId.slice(0, 8) || '(empty)'}`));
  } catch (e) { log(`enumerateDevices failed: ${e.name}: ${e.message}`, 'err'); }
};
$('perm').onclick = async () => {
  if (!navigator.permissions?.query) { log('Permissions API not available', 'err'); return; }
  try {
    const p = await navigator.permissions.query({ name: 'camera' });
    log(`camera permission: ${p.state}`, p.state === 'granted' ? 'ok' : p.state === 'denied' ? 'err' : '');
    p.onchange = () => log(`camera permission changed: ${p.state}`);
  } catch (e) { log(`permissions.query failed: ${e.name}: ${e.message}`, 'err'); }
};
$('clear').onclick = () => { logEl.textContent = ''; };

log('Page loaded');
</script>
</body>
</html>
